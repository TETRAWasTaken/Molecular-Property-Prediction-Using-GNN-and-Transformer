$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: GIN-Transformer_Training
experiment_name: GIN-Transformer_Training

# enter path to your script files
code: .

command: >-
    python main.py 
    --qm8_path ${{inputs.trainingData1}}
    --qm9_path ${{inputs.trainingData2}}

# invoke completions (Ctrl+Space, Cmd+Space) to see the list of environments available
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: conda.yml

# invoke completions (Ctrl+Space, Cmd+Space) to see the list of computes available. 
compute: azureml:QMDataset

# This defines the input data to mount. The names of the items in inputs can be referenced in the command
inputs:
  trainingData1:
    type: uri_file
    mode: ro_mount
    path: azureml://subscriptions/5ce94729-ef81-411c-b4bd-872a2434cc8b/resourcegroups/GIN-Transformer/workspaces/GNN-Transformer/datastores/workspaceblobstore/paths/UI/2026-02-12_130127_UTC/Dataset/qm8.csv
  trainingData2:
    type: uri_file
    mode: ro_mount
    path: azureml://subscriptions/5ce94729-ef81-411c-b4bd-872a2434cc8b/resourcegroups/GIN-Transformer/workspaces/GNN-Transformer/datastores/workspaceblobstore/paths/UI/2026-02-12_130127_UTC/Dataset/qm9.csv
