name: Build Windows Inference DLL

on:
  workflow_dispatch:

jobs:
  build-dll:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: ['x64']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Download ONNX Runtime SDK (Windows x64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVersion = '1.24.4'
          $zipName = "onnxruntime-win-x64-$ortVersion.zip"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/$zipName"
          $ortAssets = 'GUI\assets'
          $zipPath = 'onnxruntime.zip'
          $extractedDir = Join-Path $ortAssets "onnxruntime-win-x64-$ortVersion"
          $targetDir = Join-Path $ortAssets 'onnxruntime-win-x64'

          Write-Host "Downloading ONNX Runtime from $ortUrl"
          Invoke-WebRequest -Uri $ortUrl -OutFile $zipPath
          Write-Host 'Download successful'

          New-Item -ItemType Directory -Path $ortAssets -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $ortAssets -Force
          Write-Host "Extracted ONNX Runtime to $ortAssets"

          if (-not (Test-Path $extractedDir)) {
            Write-Error "Expected extracted directory not found: $extractedDir"
            exit 1
          }

          if (Test-Path $targetDir) {
            Remove-Item -Path $targetDir -Recurse -Force
          }

          Rename-Item -Path $extractedDir -NewName 'onnxruntime-win-x64'
          Write-Host 'Normalized directory name to onnxruntime-win-x64'

      - name: Build DLL with MSVC
        shell: powershell
        working-directory: GUI/core
        run: |
          $env:ORT_ROOT = "..\..\GUI\assets\onnxruntime-win-x64"
          $env:ORT_INC = "$env:ORT_ROOT\include"
          $env:ORT_LIB = "$env:ORT_ROOT\lib"
          
          Write-Host "ORT_ROOT: $env:ORT_ROOT"
          Write-Host "ORT_INC: $env:ORT_INC"
          Write-Host "ORT_LIB: $env:ORT_LIB"
          
          # Verify paths exist
          if (-not (Test-Path $env:ORT_INC)) {
            Write-Error "Include directory not found: $env:ORT_INC"
            exit 1
          }
          if (-not (Test-Path $env:ORT_LIB)) {
            Write-Error "Lib directory not found: $env:ORT_LIB"
            exit 1
          }
          
          # Compile with MSVC
          cl.exe /I"$env:ORT_INC" /O2 /W4 /LD inference.c /link /LIBPATH:"$env:ORT_LIB" onnxruntime.lib /OUT:hybrid_engine.dll
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host "Build successful: hybrid_engine.dll"
          dir hybrid_engine.dll

      - name: Copy DLL to assets
        shell: powershell
        run: |
          $src = "GUI\core\hybrid_engine.dll"
          $dst = "GUI\assets\hybrid_engine.dll"
          
          if (Test-Path $src) {
            New-Item -ItemType Directory -Path "GUI\assets" -Force | Out-Null
            Copy-Item -Path $src -Destination $dst -Force
            Write-Host "DLL copied to assets"
          } else {
            Write-Error "DLL not found at $src"
            exit 1
          }

      - name: Verify DLL
        shell: powershell
        run: |
          $dll_path = "GUI\assets\hybrid_engine.dll"
          if (Test-Path $dll_path) {
            $size = (Get-Item $dll_path).Length
            Write-Host "DLL verified: $dll_path ($size bytes)"
          } else {
            Write-Error "DLL verification failed"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid_engine-x64
          path: GUI/assets/hybrid_engine.dll
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: GUI/assets/hybrid_engine.dll
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
