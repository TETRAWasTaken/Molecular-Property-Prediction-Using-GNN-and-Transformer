$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: molecular-hybrid-training
description: Train the hybrid GIN + ChemBERTa model on Azure ML serverless compute.
experiment_name: molecular-property-hybrid
code: ..
command: >-
  python main.py
resources:
  instance_type: Standard_NC
  instance_count: 1
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: hybrid-conda.yml
environment_variables:
  HF_HUB_OFFLINE: "0"
  MOLECULE_CSV_PATH: ${{inputs.mol_csv}}
  ATOM_CSV_PATH: ${{inputs.atom_csv}}
  TOKENIZED_CACHE_PATH: ${{outputs.cache_dir}}/tokenized_dataset.pt
  HYBRID_MODEL_OUTPUT_PATH: ${{outputs.model_dir}}/best_hybrid_model.pth
inputs:
  mol_csv:
    type: uri_file
    path: ../Dataset/New_QM9/molecule_properties.csv
  atom_csv:
    type: uri_file
    path: ../Dataset/New_QM9/atom_properties.csv
outputs:
  model_dir:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/molecular-hybrid-training/model/
  cache_dir:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/molecular-hybrid-training/cache/
