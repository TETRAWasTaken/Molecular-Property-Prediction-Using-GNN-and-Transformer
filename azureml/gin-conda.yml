name: gin-training
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy<2.0          # torch-geometric requires numpy<2
  - pandas
  - scipy
  - scikit-learn
  - rdkit              # conda-forge build; reliable on Linux
  - pip:
      # ── PyTorch CPU-only ───────────────────────────────────────────────────
      - torch==2.3.1
          --index-url https://download.pytorch.org/whl/cpu
      # ── PyTorch Geometric — CPU wheels ────────────────────────────────────
      - torch-geometric==2.5.3
      - torch-scatter==2.1.2
          --find-links https://data.pyg.org/whl/torch-2.3.0+cpu.html
      - torch-sparse==0.6.18
          --find-links https://data.pyg.org/whl/torch-2.3.0+cpu.html
      - torch-cluster==1.6.3
          --find-links https://data.pyg.org/whl/torch-2.3.0+cpu.html
      # ── Miscellaneous ─────────────────────────────────────────────────────
      - matplotlib
      - networkx
      - dask[dataframe]
      - art
      - azureml-mlflow       # experiment tracking in Azure ML Studio
