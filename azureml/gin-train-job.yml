$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: molecular-gin-training
description: >
  Train the standalone GIN model on Azure ML serverless CPU compute.
  Preprocesses the QM9 graph dataset, trains GIN with virtual nodes and
  residual connections, and saves the checkpoint.
experiment_name: molecular-property-gin

# ── Source code ───────────────────────────────────────────────────────────────
code: ..

# ── Entry point ───────────────────────────────────────────────────────────────
command: >-
  python GIN_2/manual_run.py
  --mol_csv ${{inputs.mol_csv}}
  --atom_csv ${{inputs.atom_csv}}
  --save_path ${{outputs.model_dir}}/GIN_model.pth

# ── Serverless CPU compute ────────────────────────────────────────────────────
# No 'compute:' key = serverless (auto-provisioned, pay-per-minute).
# Standard_D4as_v4 uses 4 vCPUs and 16 GB memory.
resources:
  instance_type: Standard_D4as_v4
  instance_count: 1

# ── Environment ───────────────────────────────────────────────────────────────
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: gin-conda.yml

# ── Environment variables ──────────────────────────────────────────────────────
environment_variables:
  HF_HUB_OFFLINE: "0"

# ── Inputs ────────────────────────────────────────────────────────────────────
inputs:
  mol_csv:
    type: uri_file
    path: azureml:qm9-molecule-csv@latest
  atom_csv:
    type: uri_file
    path: azureml:qm9-atom-csv@latest

# ── Outputs ───────────────────────────────────────────────────────────────────
outputs:
  model_dir:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/molecular-gin/model/
    mode: rw_mount
  cache_dir:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/molecular-gin/cache/
    mode: rw_mount
