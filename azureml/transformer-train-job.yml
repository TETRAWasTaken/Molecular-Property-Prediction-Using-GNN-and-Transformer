$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: molecular-transformer-training
description: >
  Fine-tune the standalone ChemBERTa transformer on QM9 molecular properties
  on Azure ML serverless CPU compute.
experiment_name: molecular-property-transformer

# ── Source code ───────────────────────────────────────────────────────────────
code: ..

# ── Entry point ───────────────────────────────────────────────────────────────
command: >-
  python Transformers_2/manual_run.py
  --mol_csv ${{inputs.mol_csv}}
  --save_path ${{outputs.model_dir}}/transformer_model.pth
  --cache_path Transformers_2/outputs/cache/tokenized_dataset.pt

# ── Serverless CPU compute ────────────────────────────────────────────────────
# No 'compute:' key = serverless (auto-provisioned, pay-per-minute).
# Standard_D4as_v4 uses 4 vCPUs and 16 GB memory.
resources:
  instance_type: Standard_D4as_v4
  instance_count: 1

# ── Environment ───────────────────────────────────────────────────────────────
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: transformer-conda.yml

# ── Environment variables ──────────────────────────────────────────────────────
environment_variables:
  HF_HUB_OFFLINE: "0"

# ── Inputs ────────────────────────────────────────────────────────────────────
inputs:
  mol_csv:
    type: uri_file
    path: azureml:qm9-molecule-csv@latest

# ── Outputs ───────────────────────────────────────────────────────────────────
outputs:
  model_dir:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/molecular-transformer/model/
    mode: rw_mount
  cache_dir:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/molecular-transformer/cache/
    mode: rw_mount
