name: hybrid-training
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy<2.0          # torch-geometric requires numpy<2
  - pandas
  - scipy
  - scikit-learn
  - rdkit              # conda-forge build; reliable on Linux
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - --find-links https://data.pyg.org/whl/torch-2.3.0+cpu.html
      # ── PyTorch CPU-only ───────────────────────────────────────────────────
      # Serverless CPU compute has no GPU; use the +cpu index.
      - torch==2.3.1+cpu
      - torchvision==0.18.1+cpu
      # ── PyTorch Geometric — CPU wheels ────────────────────────────────────
      - torch-geometric==2.5.3
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
      - torch-cluster==1.6.3
      # ── HuggingFace ───────────────────────────────────────────────────────
      - transformers==4.41.2
      - tokenizers>=0.19
      # ── Miscellaneous ─────────────────────────────────────────────────────
      - matplotlib
      - networkx
      - dask[dataframe]
      - onnxruntime          # CPU-only ONNX runtime (no -gpu suffix)
      - art
      - azureml-mlflow       # experiment tracking in Azure ML Studio
