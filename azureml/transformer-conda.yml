name: transformer-training
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy<2.0
  - pandas
  - scipy
  - scikit-learn
  - rdkit
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      # ── PyTorch CPU-only ───────────────────────────────────────────────────
      - torch==2.3.1+cpu
      # ── HuggingFace ───────────────────────────────────────────────────────
      - transformers==4.41.2
      - tokenizers>=0.19
      # ── Miscellaneous ─────────────────────────────────────────────────────
      - dask[dataframe]
      - art
      - azureml-mlflow
